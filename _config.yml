# Shared settings for every policy page.
developer: SSV Makers
contact_email: ishubhamx0@gmail.com
updated: October 31, 2026        # effective date shown on every page; change it when the text changes

# User site at https://ishubhamx.github.io/: the homepage (index.html) and app-ads.txt live at the root,
# the policies under /privacy/.
baseurl: ""

# Each file in _apps/ is one app and becomes its privacy page at /privacy/<file-name>/ (e.g.
# _apps/arrow-maze.md -> /privacy/arrow-maze/). Use `layout: app` for a generated policy, or write the page by hand in an .html file.
collections:
  apps:
    output: true
    permalink: /privacy/:name/

exclude: [README.md]
